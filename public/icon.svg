<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F292E"/>
      <stop offset="48%" stop-color="#0B161E"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="256" cy="230" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="barOuter" x1="256" y1="124" x2="256" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E6FFFA"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="barInner" x1="256" y1="124" x2="256" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Squircle obsidian-teal glass base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#coreGlow)"/>
  <rect x="23" y="23" width="466" height="466" rx="109" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Subtle inner sonic ring -->
  <circle cx="256" cy="256" r="184" stroke="#2DD4BF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- 5-Bar Acoustic-Wave "M" Monogram -->
  <!-- Left Outer Pillar -->
  <rect x="114" y="128" width="42" height="256" rx="21" fill="url(#barOuter)"/>
  <!-- Left Inner Shoulder Bar -->
  <rect x="175" y="128" width="42" height="148" rx="21" fill="url(#barInner)"/>
  <!-- Center Dip Bar -->
  <rect x="235" y="128" width="42" height="196" rx="21" fill="url(#barOuter)"/>
  <!-- Right Inner Shoulder Bar -->
  <rect x="295" y="128" width="42" height="148" rx="21" fill="url(#barInner)"/>
  <!-- Right Outer Pillar -->
  <rect x="356" y="128" width="42" height="256" rx="21" fill="url(#barOuter)"/>

  <!-- Live Listening Pulse Dot under Center Bar -->
  <circle cx="256" cy="364" r="15" fill="#2DD4BF"/>
</svg>
