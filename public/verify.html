<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MockMate — Verify email</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0e;--paper:#16161d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.35);--accent:#8b5cf6;--grad:linear-gradient(135deg,#7c3aed,#f97316);--ok:#4ade80;--bad:#fb7185;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
  body{font-family:var(--font);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(800px 460px at 20% 0%,rgba(124,58,237,.16),transparent 60%),var(--bg)}
  .card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}.mark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center}.brand b{font-size:14px;font-weight:600}
  h1{font-size:20px;font-weight:650;margin-bottom:6px}.sub{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:18px}
  .btn{width:100%;height:44px;border:none;border-radius:10px;background:var(--grad);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.msg{font-size:13px;min-height:18px;margin-bottom:4px}.msg.err{color:var(--bad)}.foot{margin-top:16px;text-align:center;font-size:13px}.foot a{color:var(--accent);text-decoration:none}.center-state{text-align:center}.center-state .icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:22px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6.5a1 1 0 0 1 1.8-.6L12 14l6.2-8.1a1 1 0 0 1 1.8.6V19"/></svg></span><b>MockMate</b></div>
    <div id="form-view">
      <h1>Verify your email</h1>
      <p class="sub">Confirm the email address for your MockMate account. This link expires in 24 hours.</p>
      <div class="msg err" id="err"></div><button class="btn" id="submit" type="button">Verify email address</button>
    </div>
    <div id="done-view" class="center-state" style="display:none"><div class="icon" id="done-icon"></div><h1 id="done-title"></h1><p class="sub" id="done-sub" style="margin-bottom:6px"></p><div class="foot" id="done-foot"></div></div>
  </div>
  <script src="auth-web.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var params = new URLSearchParams(location.search);
    var token = params.get('verify_token');
    // Verification tokens are credentials. Remove them from the visible URL/history
    // immediately after reading so history, screenshots and referrers don't retain it.
    if (token && history.replaceState) history.replaceState(null, document.title, location.pathname + location.hash);

    function showDone(ok, title, sub, footHTML) {
      $('form-view').style.display = 'none'; var dv = $('done-view'); dv.style.display = 'block';
      $('done-icon').style.background = ok ? 'rgba(74,222,128,.14)' : 'rgba(251,113,133,.14)';
      $('done-icon').innerHTML = ok ? '✓' : '!'; $('done-title').textContent = title; $('done-sub').textContent = sub; $('done-foot').innerHTML = footHTML || '';
    }
    if (!token) { showDone(false, 'Invalid verification link', 'This link is missing its token. Request a new one from the sign-in screen.', '<a href="landing.html">← Back to MockMate</a>'); return; }

    $('submit').addEventListener('click', async function () {
      var btn = $('submit'); btn.disabled = true; btn.textContent = 'Verifying…'; $('err').textContent = '';
      try {
        // The endpoint also returns a session token, but browser storage is not the
        // Electron secure token store — same posture as reset.html: do not pretend
        // this page signed the app in; require an explicit sign-in on each surface.
        await MMAuth.api('/auth/verify-email', { method: 'POST', body: { token: token } });
        token = null;
        showDone(true, 'Email verified', 'Your account is ready. Return to MockMate and sign in.', '<a href="landing.html">Back to MockMate →</a>');
      } catch (e) {
        $('err').textContent = e.network ? 'Can’t reach the server. Try again in a moment.' : (e.message || 'Could not verify your email.');
        btn.disabled = false; btn.textContent = 'Verify email address';
      }
    });
  })();
  </script>
</body>
</html>
