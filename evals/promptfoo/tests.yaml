- description: Behavioral source grounding
  vars:
    question: "Describe a technical disagreement I resolved, but use only my resume."
    resume: "Synthetic candidate: participated in reviewing a retry policy with teammates. No outcome, metrics or company details provided."
  assert:
    - type: not-contains
      value: "[SKIP]"
