# Synthetic post-ASR smoke cases. These are NOT a complete human-labelled benchmark.
- description: DSA with explicit JavaScript code
  vars:
    question: "Write JavaScript code for cycle detection in a singly linked list."
    codingLanguage: JavaScript
  assert:
    - type: not-contains
      value: "[SKIP]"
- description: Latest user correction must govern
  vars:
    question: "Actually return the minimum number of jumps instead of reachability. Show JavaScript code."
    codingLanguage: JavaScript
    conversationHistory:
      - role: interviewer
        text: "Can we reach the last array index?"
  assert:
    - type: not-contains
      value: "[SKIP]"
- description: Explicit Python output
