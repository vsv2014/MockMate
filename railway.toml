[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm --prefix backend ci"

[deploy]
startCommand = "npm --prefix backend start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.env]
HOST = "0.0.0.0"
MOCKMATE_HOSTED = "1"
TRUST_PROXY_HOPS = "1"
