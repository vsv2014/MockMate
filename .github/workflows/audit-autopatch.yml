name: One-shot desktop audit patch

on:
  push:
    branches: [codex/desktop-audit-67]
    paths:
      - '.github/audit-patch-trigger'

permissions:
  contents: write

concurrency:
  group: desktop-audit-autopatch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/desktop-audit-67
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply deterministic Live state patch
        run: node scripts/audit-state-patch.mjs
      - name: Verify patched source
        run: npm ci && npm --prefix backend ci && npm test && npm run smoke:api && npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'mockmate-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add shared/interviewState.js src/LiveCompanion.jsx shared/interviewState.authority.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce Live generation authority and retain full session context'
          git pull --rebase origin codex/desktop-audit-67
          git push origin HEAD:codex/desktop-audit-67
