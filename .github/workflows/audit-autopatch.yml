name: One-shot desktop audit patch

on:
  push:
    branches: [codex/desktop-audit-final]
    paths:
      - '.github/audit-patch-trigger'

permissions:
  contents: write

concurrency:
  group: desktop-audit-autopatch-final
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/desktop-audit-final
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply final Electron lifecycle patch
        run: node scripts/audit-last-mile.mjs
      - name: Verify patched source
        run: npm ci && npm --prefix backend ci && npm test && npm run smoke:api && npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'mockmate-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add electron/bootstrap.cjs electron/main.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'Drain diagnostics and protect windows before first frame'
          git pull --rebase origin codex/desktop-audit-final
          git push origin HEAD:codex/desktop-audit-final
