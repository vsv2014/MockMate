name: Refresh auth/config major locks

on:
  push:
    branches:
      - chore/auth-config-majors
    paths:
      - '.github/workflows/refresh-auth-config-majors.yml'
      - 'scripts/verify-auth-config-majors.mjs'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/auth-config-majors
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Pin stable auth/config majors
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.bcryptjs=3.0.3' 'dependencies.dotenv=18.0.5' 'scripts.verify:auth-config=node scripts/verify-auth-config-majors.mjs'
          npm --prefix backend pkg set 'dependencies.bcryptjs=3.0.3' 'dependencies.dotenv=18.0.5'
          npm install --package-lock-only --ignore-scripts
          npm --prefix backend install --package-lock-only --ignore-scripts
      - name: Commit manifests and locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Auth/config dependencies already current"
            exit 0
          fi
          git commit -m "chore(deps): upgrade bcryptjs and dotenv majors"
          git push origin HEAD:chore/auth-config-majors
