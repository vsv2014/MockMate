name: Temporary Security Lockfile Repair

on:
  push:
    branches: [security/remediate-npm-advisories-20261109]
    paths: ['.github/workflows/temporary-security-lock-repair.yml']

permissions:
  contents: write

jobs:
  repair-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Regenerate lockfiles via official npm resolver (no force)
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --no-fund
          npm --prefix backend audit fix --package-lock-only --no-fund
      - name: Ensure lockfiles actually fix production advisories
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix backend ci
          npm audit --omit=dev --audit-level=low
          npm --prefix backend audit --audit-level=low
      - name: Verify tests and application build
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run smoke:api
          npm run build
          npm run verify:vite-output
      - name: Commit only verified npm manifest and lockfile updates to this branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/security/remediate-npm-advisories-20261109" ]; then
            echo "Refusing to write outside dedicated remediation branch" >&2
            exit 1
          fi
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest/lockfile changes; verify whether advisories were already resolved."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): update npm lockfiles to patched production dependencies"
          git push origin HEAD:refs/heads/security/remediate-npm-advisories-20261109
