name: All Open PRs Local Test Build

# Branch-only CI for experimental integration. Not a stable release or PR merge gate.
on:
  push:
    branches:
      - test/all-open-prs-20261109
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-prs-local-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci && npm --prefix backend ci
      - name: Require production dependency security
        run: npm audit --omit=dev --audit-level=low && npm --prefix backend audit --audit-level=low
      - name: Verify all integration tests and source builds
        run: |
          npm run verify:platform
          npm test
          npm run smoke:api
          npm run build
          npm run verify:vite-output

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci && npm --prefix backend ci
      - name: Verify source, security and preview identity
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=low
          if ($LASTEXITCODE -ne 0) { throw 'Root production security audit failed' }
          npm --prefix backend audit --audit-level=low
          if ($LASTEXITCODE -ne 0) { throw 'Backend production security audit failed' }
          node --test scripts/personal-preview-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preview isolation contract failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          npm run smoke:api
          if ($LASTEXITCODE -ne 0) { throw 'API smoke failed' }
      - name: Configure distinct local-only Personal Preview, without modifying source branch
        shell: pwsh
        run: |
          node scripts/configure-unsigned-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preview config failed' }
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          if ($p.personalPreviewBuild -ne $true -or $p.build.appId -ne 'com.mockmate.personal.preview' -or $p.managedApiBase -ne '' -or $null -ne $p.build.publish) { throw 'Preview identity or updater isolation failed' }
      - name: Verify production renderer
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite build failed' }
          npm run verify:vite-output
          if ($LASTEXITCODE -ne 0) { throw 'Built renderer invalid' }
      - name: Build unpacked unsigned Windows preview (no NSIS download)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: |
          npx electron-builder --win --dir --publish never --config.win.forceCodeSigning=false --config.win.signAndEditExecutable=false
          if ($LASTEXITCODE -ne 0) { throw 'Portable preview packaging failed' }
      - name: Packaged Electron runtime smoke
        shell: pwsh
        run: ./scripts/windows-packaged-smoke.ps1
      - name: Verify app isolation and stage portable test bundle
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'release/win-unpacked/MockMatePersonalPreview.exe'
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'NotSigned') { throw 'Unsigned test executable unexpectedly signed' }
          if (Test-Path 'release/win-unpacked/resources/app-update.yml') { throw 'No updater feed allowed in preview' }
          New-Item staged -ItemType Directory -Force | Out-Null
          $zip = "staged/MockMate-Personal-Preview-1.6.6-all-prs-${{ github.run_number }}-PORTABLE.zip"
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path $zip -Leaf)" | Set-Content staged/SHA256SUMS.txt -Encoding utf8
          @"
          MockMate ALL-OPEN-PRs experimental test bundle — NOT a public release.
          Source commit: $env:SOURCE_SHA
          Branch: $env:SOURCE_REF
          Portable unsigned BYOK-only app; extract the ZIP into its own folder.
          Launch MockMatePersonalPreview.exe. No NSIS installer or auto updater.
          Stable MockMate app, shortcuts and userData are not intentionally modified.
          Unverified on your physical Windows audio / share-preview setup.
          Contains code from PRs #118 #112 #108 #109 and docs #102.
          Composio OAuth, voice VAD, model benchmarks and hosted cloud sync are NOT integrated here.
          Never run real paid AI evaluations without explicit manual opt-in.
          "@ | Set-Content staged/TEST-NOTICE.txt -Encoding utf8
      - name: Upload portable preview archive, checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mockmate-all-prs-windows-${{ github.run_number }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14
