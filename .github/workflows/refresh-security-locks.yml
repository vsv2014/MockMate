name: Refresh security lockfiles
# rerun: production-audit policy

on:
  push:
    branches:
      - hotfix/security-advisories-2026-10-07
    paths:
      - '.github/workflows/refresh-security-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/security-advisories-2026-10-07
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Regenerate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm --prefix backend install --package-lock-only --ignore-scripts
      - name: Verify zero advisories
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix backend audit --audit-level=low
      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git commit -m "fix(security): refresh audited lockfiles"
          git push origin HEAD:hotfix/security-advisories-2026-10-07
