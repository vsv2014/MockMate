name: Build & Release MockMate (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v1.5.1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.5.1)'
        required: true
        default: 'v1.5.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source and version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref == 'refs/heads/release/v1.5.1' && 'v1.5.1') || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Manual releases must be dispatched from the current main HEAD." >&2
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json')
          const tag = String(process.env.RELEASE_TAG || '')
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`)
          if (tag.slice(1) !== pkg.version) throw new Error(`Release tag ${tag} does not match package.json ${pkg.version}`)
          console.log(`Release provenance/version verified: ${tag}`)
          NODE
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: provenance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync release version into lock metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkg = require('./package.json')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = pkg.version
          if (lock.packages?.['']) lock.packages[''].version = pkg.version
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')
          NODE

      - run: npm ci
      - run: npm --prefix backend ci

      - name: Bootstrap Electron runtime
        run: npx electron --version

      - name: Unit, API smoke and production build
        run: npm test && npm run smoke:api && npm run build

      - name: Configure final release AI mode
        shell: bash
        env:
          MANAGED_API_BASE: ${{ vars.MOCKMATE_API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const raw = String(process.env.MANAGED_API_BASE || '').trim().replace(/\/$/, '')
          let managed = false
          if (raw) {
            let url
            try { url = new URL(raw) } catch { console.error('When set, MOCKMATE_API_BASE must be a valid hosted URL.'); process.exit(1) }
            if (url.protocol !== 'https:' || /^(localhost|127\.0\.0\.1)$/i.test(url.hostname)) {
              console.error('MOCKMATE_API_BASE must use HTTPS and must not point to loopback.'); process.exit(1)
            }
            managed = true
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.managedApiBase = raw
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          fs.writeFileSync('.env.production.local', `VITE_MANAGED_AI_AVAILABLE=${managed}\n${managed ? `VITE_API_BASE=${raw}\n` : ''}`)
          NODE

      - name: Verify final configured application
        run: npm test && npm run build

      - name: Build Windows installer
        shell: bash
        run: |
          unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Windows release artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          $yml = Get-ChildItem release -Filter latest.yml | Select-Object -First 1
          $blockmap = Get-ChildItem release -Filter *.blockmap | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer missing' }
          if (-not $yml) { throw 'latest.yml missing' }
          if (-not $blockmap) { throw 'Windows blockmap missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [provenance, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: staged
      - name: Verify Windows artifacts are staged
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find staged -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name 'latest.yml' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name '*.blockmap' -print -quit)"
      - name: Publish Windows GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ needs.provenance.outputs.tag }}
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
