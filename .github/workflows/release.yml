name: Build & Release MockMate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failure must not cancel the others (Linux already uploaded when Win failed).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: |
              release/*.AppImage
              release/*.yml
          - os: windows-latest
            platform: win
            artifact: |
              release/*.exe
              release/*.yml
              release/*.blockmap
          - os: macos-latest
            platform: mac
            artifact: |
              release/*.dmg
              release/*.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42+ fetches the platform binary lazily rather than in postinstall.
      - name: Bootstrap Electron runtime
        run: npx electron --version

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json')
          const tag = String(process.env.RELEASE_TAG || '').replace(/^v/, '')
          if (tag !== pkg.version) {
            console.error(`Release tag v${tag} does not match package.json ${pkg.version}`)
            process.exit(1)
          }
          console.log(`Release version verified: v${tag}`)
          NODE

      - name: Unit and API smoke tests
        run: npm test && npm run smoke:api

      - name: Configure hosted Managed AI endpoint
        shell: bash
        env:
          MANAGED_API_BASE: ${{ vars.MOCKMATE_API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const raw = String(process.env.MANAGED_API_BASE || '').trim().replace(/\/$/, '')
          let url
          try { url = new URL(raw) } catch { console.error('Repository variable MOCKMATE_API_BASE must be a valid hosted URL.'); process.exit(1) }
          if (url.protocol !== 'https:' || /^(localhost|127\.0\.0\.1)$/i.test(url.hostname)) {
            console.error('MOCKMATE_API_BASE must use HTTPS and must not point to loopback.')
            process.exit(1)
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.managedApiBase = raw
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          console.log(`Managed AI endpoint configured: ${url.origin}`)
          NODE

      - name: Build frontend (Vite)
        env:
          VITE_API_BASE: ${{ vars.MOCKMATE_API_BASE }}
        run: npm run build

      # Signing is optional and per-platform:
      # - Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (Authenticode .pfx/.p12, base64)
      # - macOS:   MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD + APPLE_* (see SIGNING.md)
      # If secrets are missing, the build still ships — unsigned (SmartScreen / Gatekeeper warnings).
      # CRITICAL: unset empty CSC_* env vars. Actions expands missing secrets to "" and
      # electron-builder treats that as a path → "WIN_CSC_LINK is not correct … not a file".
      - name: Build Electron installer (${{ matrix.platform }})
        shell: bash
        run: |
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "${MAC_CSC_LINK:-}" ]; then unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Prefer explicit certs from secrets; don't hunt the runner keychain/store.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged artifacts and update metadata
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const files = fs.readdirSync('release')
          const has = re => files.some(f => re.test(f))
          const required = process.env.PLATFORM === 'win'
            ? [[/\.exe$/i, 'Windows installer'], [/^latest\.yml$/i, 'latest.yml'], [/\.blockmap$/i, 'Windows blockmap']]
            : process.env.PLATFORM === 'linux'
              ? [[/\.AppImage$/i, 'Linux AppImage'], [/^latest-linux\.yml$/i, 'latest-linux.yml']]
              : [[/\.dmg$/i, 'macOS DMG']]
          const missing = required.filter(([re]) => !has(re)).map(([, label]) => label)
          if (missing.length) {
            console.error(`Missing required ${process.env.PLATFORM} artifact(s): ${missing.join(', ')}`)
            console.error(`Generated files: ${files.join(', ')}`)
            process.exit(1)
          }
          console.log(`Verified ${process.env.PLATFORM} artifacts: ${files.join(', ')}`)
          NODE

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
