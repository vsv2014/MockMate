name: Build & Release MockMate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failure must not cancel the others (Linux already uploaded when Win failed).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: |
              release/*.AppImage
              release/*.yml
          - os: windows-latest
            platform: win
            artifact: |
              release/*.exe
              release/*.yml
              release/*.blockmap
          - os: macos-latest
            platform: mac
            artifact: |
              release/*.dmg
              release/*.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend (Vite)
        run: npm run build

      # Bake runtime keys into the installer so downloaders can use Live/Solo without setup.
      # Keys come from GitHub Actions secrets (never committed). Missing secrets → empty .env →
      # users fall back to in-app Settings / BYOK.
      - name: Write bundled .env for packaging
        shell: bash
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const keys = [
            'DEEPGRAM_API_KEY',
            'GROQ_API_KEY',
            'GEMINI_API_KEY',
            'OPENAI_API_KEY',
            'ANTHROPIC_API_KEY',
            'CEREBRAS_API_KEY',
          ]
          const lines = []
          for (const k of keys) {
            const v = (process.env[k] || '').trim()
            if (v) lines.push(`${k}=${v}`)
          }
          fs.writeFileSync('.env', lines.length ? lines.join('\n') + '\n' : '')
          console.log(`Bundled ${lines.length} runtime key(s) into .env (values not logged).`)
          if (!process.env.DEEPGRAM_API_KEY) {
            console.warn('WARN: DEEPGRAM_API_KEY secret missing — Live voice will require BYOK after install.')
          }
          NODE

      # Signing is optional and per-platform:
      # - Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (Authenticode .pfx/.p12, base64)
      # - macOS:   MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD + APPLE_* (see SIGNING.md)
      # If secrets are missing, the build still ships — unsigned (SmartScreen / Gatekeeper warnings).
      # CRITICAL: unset empty CSC_* env vars. Actions expands missing secrets to "" and
      # electron-builder treats that as a path → "WIN_CSC_LINK is not correct … not a file".
      - name: Build Electron installer (${{ matrix.platform }})
        shell: bash
        run: |
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "${MAC_CSC_LINK:-}" ]; then unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Prefer explicit certs from secrets; don't hunt the runner keychain/store.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
