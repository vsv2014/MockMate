name: Build & Release MockMate

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v1.5.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source and version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref == 'refs/heads/release/v1.5.0' && 'v1.5.0') || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Manual releases must be dispatched from the current main HEAD." >&2
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json')
          const tag = String(process.env.RELEASE_TAG || '')
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`)
          if (tag.slice(1) !== pkg.version) throw new Error(`Release tag ${tag} does not match package.json ${pkg.version}`)
          console.log(`Release provenance/version verified: ${tag}`)
          NODE
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Sync release version into lock metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkg = require('./package.json')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = pkg.version
          if (lock.packages?.['']) lock.packages[''].version = pkg.version
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')
          NODE
      - run: npm ci
      - run: npm --prefix backend ci

      - name: Require public-release signing credentials (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD" || { echo 'Windows signing credentials are required for a public release.' >&2; exit 1; }

      - name: Require public-release signing/notarization credentials (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MAC_CSC_LINK" && test -n "$MAC_CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" \
            || { echo 'macOS signing + notarization credentials are required for a public release.' >&2; exit 1; }

      - name: Bootstrap Electron runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then npx electron --no-sandbox --version; else npx electron --version; fi

      - name: Unit, API smoke and production build
        run: npm test && npm run smoke:api && npm run build

      - name: Configure final release AI mode
        shell: bash
        env:
          MANAGED_API_BASE: ${{ vars.MOCKMATE_API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const raw = String(process.env.MANAGED_API_BASE || '').trim().replace(/\/$/, '')
          let managed = false
          if (raw) {
            let url
            try { url = new URL(raw) } catch { console.error('When set, MOCKMATE_API_BASE must be a valid hosted URL.'); process.exit(1) }
            if (url.protocol !== 'https:' || /^(localhost|127\.0\.0\.1)$/i.test(url.hostname)) {
              console.error('MOCKMATE_API_BASE must use HTTPS and must not point to loopback.'); process.exit(1)
            }
            managed = true
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.managedApiBase = raw
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          fs.writeFileSync('.env.production.local', `VITE_MANAGED_AI_AVAILABLE=${managed}\n${managed ? `VITE_API_BASE=${raw}\n` : ''}`)
          NODE

      - name: Verify final configured application
        run: npm test && npm run build

      - name: Build Electron installer
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($sig.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($sig.Status)" }

      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -type d -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo 'Packaged .app missing for signature verification.' >&2; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify required artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const files = fs.readdirSync('release')
          const has = re => files.some(f => re.test(f))
          const required = process.env.PLATFORM === 'win'
            ? [[/\.exe$/i, 'Windows installer'], [/^latest\.yml$/i, 'latest.yml'], [/\.blockmap$/i, 'Windows blockmap']]
            : process.env.PLATFORM === 'linux'
              ? [[/\.AppImage$/i, 'Linux AppImage'], [/^latest-linux\.yml$/i, 'latest-linux.yml']]
              : [[/\.dmg$/i, 'macOS DMG'], [/\.zip$/i, 'macOS updater ZIP'], [/^latest-mac\.yml$/i, 'latest-mac.yml']]
          const missing = required.filter(([re]) => !has(re)).map(([, label]) => label)
          if (missing.length) throw new Error(`Missing required artifacts: ${missing.join(', ')}; generated: ${files.join(', ')}`)
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [provenance, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staged
          merge-multiple: true
      - name: Verify all platform artifacts are staged
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find staged -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name '*.zip' -print -quit)"
      - name: Publish one atomic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ needs.provenance.outputs.tag }}
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
