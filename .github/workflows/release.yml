name: Build & Release MockMate (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (must match package.json version, e.g. v1.5.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release source and version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Manual releases must be dispatched from the current main HEAD." >&2
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json')
          const tag = String(process.env.RELEASE_TAG || '')
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`)
          if (tag.slice(1) !== pkg.version) throw new Error(`Release tag ${tag} does not match package.json ${pkg.version}`)
          console.log(`Release provenance/version verified: ${tag}`)
          NODE
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: provenance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Require production Windows signing identity
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SIGNING_PUBLISHER: ${{ vars.MOCKMATE_WINDOWS_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ] || [ -z "$SIGNING_PUBLISHER" ]; then
            echo "Public Windows releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets plus MOCKMATE_WINDOWS_PUBLISHER (exact certificate Subject)." >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.build?.win?.verifyUpdateCodeSignature !== true) {
            throw new Error('Windows update signature verification must be enabled before publishing.')
          }
          pkg.build.win.signtoolOptions.publisherName = process.env.SIGNING_PUBLISHER
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Sync release version into lock metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkg = require('./package.json')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = pkg.version
          if (lock.packages?.['']) lock.packages[''].version = pkg.version
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')
          NODE

      - run: npm run verify:platform
      - run: npm run verify:react19
      - run: npm run verify:vitest5
      - run: npm run verify:dev-tooling
      - run: npm run verify:auth-config
      - run: npm run verify:express5
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Require zero production dependency advisories before publication
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix backend audit --audit-level=low

      - name: Bootstrap Electron runtime
        run: npx electron --version

      - name: Unit, API smoke and production build
        run: npm test && npm run smoke:api && npm run build && npm run verify:vite-output

      - name: Configure final release AI mode
        shell: bash
        env:
          MANAGED_API_BASE: ${{ vars.MOCKMATE_API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const raw = String(process.env.MANAGED_API_BASE || '').trim().replace(/\/$/, '')
          let managed = false
          if (raw) {
            let url
            try { url = new URL(raw) } catch { console.error('When set, MOCKMATE_API_BASE must be a valid hosted URL.'); process.exit(1) }
            if (url.protocol !== 'https:' || /^(localhost|127\.0\.0\.1)$/i.test(url.hostname)) {
              console.error('MOCKMATE_API_BASE must use HTTPS and must not point to loopback.'); process.exit(1)
            }
            managed = true
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.managedApiBase = raw
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          fs.writeFileSync('.env.production.local', `VITE_MANAGED_AI_AVAILABLE=${managed}\n${managed ? `VITE_API_BASE=${raw}\n` : ''}`)
          NODE

      - name: Verify final configured application
        run: npm test && npm run build && npm run verify:vite-output

      - name: Build signed Windows installer
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -euo pipefail
          npx electron-builder --win --publish never

      - name: Verify Authenticode signatures and publisher
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.MOCKMATE_WINDOWS_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -Filter 'MockMate-Setup-*.exe' | Select-Object -First 1
          $appExe = Get-Item 'release/win-unpacked/MockMate.exe'
          if (-not $installer) { throw 'Windows installer missing; refuse to publish' }
          foreach ($file in @($installer, $appExe)) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($file.Name) is not signed by a trusted publisher: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -ne $env:SIGNING_PUBLISHER) {
              throw "$($file.Name) certificate subject does not match MOCKMATE_WINDOWS_PUBLISHER"
            }
          }

      - name: Smoke packaged Windows runtime before publication
        shell: pwsh
        run: ./scripts/windows-packaged-smoke.ps1

      - name: Verify Windows release artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          $yml = Get-ChildItem release -Filter latest.yml | Select-Object -First 1
          $blockmap = Get-ChildItem release -Filter *.blockmap | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer missing' }
          if (-not $yml) { throw 'latest.yml missing' }
          if (-not $blockmap) { throw 'Windows blockmap missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [provenance, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: staged
      - name: Verify Windows artifacts are staged
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find staged -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name 'latest.yml' -print -quit)"
          test -n "$(find staged -maxdepth 1 -name '*.blockmap' -print -quit)"
      - name: Publish Windows GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ needs.provenance.outputs.tag }}
          files: staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
