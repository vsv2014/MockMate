name: Refresh v1.5.5 lock metadata

on:
  push:
    branches:
      - chore/electron-44-stable
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/electron-44-stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Sync lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore(release): sync v1.5.5 lock metadata"
          git push origin HEAD:chore/electron-44-stable
