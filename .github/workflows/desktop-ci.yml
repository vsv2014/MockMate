name: Desktop CI

on:
  pull_request:
    paths-ignore:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm test
      - run: npm run smoke:api
      - run: npm run build
      - name: Package desktop directory
        run: npx electron-builder --linux --dir --publish never
      - name: Verify packaged runtime entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f release/linux-unpacked/resources/app.asar
          npx asar list release/linux-unpacked/resources/app.asar > /tmp/mockmate-asar.txt
          grep -Fxq '/electron/bootstrap-v153.cjs' /tmp/mockmate-asar.txt
          grep -Fxq '/electron/bootstrap.cjs' /tmp/mockmate-asar.txt
          grep -Fxq '/electron/main.cjs' /tmp/mockmate-asar.txt
          grep -Fxq '/server-entry.cjs' /tmp/mockmate-asar.txt
          grep -Fxq '/backend/server-entry.cjs' /tmp/mockmate-asar.txt
          grep -Fxq '/api/_lib/core.js' /tmp/mockmate-asar.txt

  # Windows must validate the runtime we actually ship, not only source-level tests.
  # The unpacked executable is launched and both local services are probed so ASAR,
  # cwd, process-spawn and packaged-path regressions fail before merge/release.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm test
      - run: npm run smoke:api
      - run: npm run build
      - name: Package Windows runtime directory
        run: npx electron-builder --win --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke packaged Windows runtime
        shell: pwsh
        run: ./scripts/windows-packaged-smoke.ps1
